name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app

  crates:
    name: Crates (Rust workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Scoped to the crates that are already rustfmt-clean; clob/risk
      # predate this check and still have formatting drift. Widen to a
      # bare `cargo fmt --check` once those are brought into line.
      - run: cargo fmt --check -p cerdic-tee-matcher -p common
        working-directory: crates
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: crates
      - run: cargo build --workspace
        working-directory: crates
      - run: cargo test --workspace
        working-directory: crates
