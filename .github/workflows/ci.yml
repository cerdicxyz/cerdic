name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: app
      - run: bun run build
        working-directory: app

  contracts:
    name: Contracts (Foundry / Solidity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
        working-directory: packages/contracts
      - run: forge build
        working-directory: packages/contracts
      - run: forge test
        working-directory: packages/contracts

  crates:
    name: Crates (Rust workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Scoped to the crates that are already rustfmt-clean; clob/risk
      # predate this check and still have formatting drift. Widen to a
      # bare `cargo fmt --check` once those are brought into line.
      - run: cargo fmt --check -p cerdic-tee-matcher -p common
        working-directory: crates
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: crates
      - run: cargo build --workspace
        working-directory: crates
      - run: cargo test --workspace
        working-directory: crates
