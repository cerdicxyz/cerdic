[package]
name = "cerdic-tee-matcher"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TEE-hosted order matcher: decrypt, match, margin-check, attest, settle. Runs identically inside GCP Confidential Space and AWS Nitro Enclaves (see ARCHITECTURE.md, docs/spec-contracts-tee.md)."

[[bin]]
name = "cerdic-tee-matcher"
path = "src/main.rs"

[dependencies]
common = { path = "../common" }
tokio = { workspace = true, features = ["full"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
alloy = { workspace = true, features = ["k256", "serde", "signer-local", "provider-http", "rpc-types-eth", "reqwest", "sol-types"] }

axum = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "ansi", "time"] }
nu-ansi-term = "0.50"
time = { version = "0.3", features = ["formatting"] }

crypto_box = { version = "0.9", features = ["std", "chacha20"] }
aes-gcm = "0.10"
base64 = "0.22"
hex = "0.4"
httparse = "1.9"
rand = "0.8"
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["limit", "timeout", "trace"] }

zk-circuits = { path = "../zk-circuits" }
ark-bn254 = "0.5"
ark-groth16 = "0.5"
ark-snark = "0.5"
ark-std = { version = "0.5", features = ["std"] }
ark-serialize = "0.5"

[dev-dependencies]
proptest.workspace = true
http-body-util = "0.1"
