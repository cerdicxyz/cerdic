[workspace]
# Standalone workspace root — see arkworks-prover/Cargo.toml for why.

[package]
name = "tiny-client"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tiny-client"
path = "src/main.rs"

[dependencies]
arkworks-prover = { path = "../arkworks-prover" }
ark-bn254 = "0.5"
ark-ff = "0.5"

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
ethers = "2"

crypto_box = { version = "0.9", features = ["std"] }
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
dotenvy = "0.15"
anyhow = "1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
