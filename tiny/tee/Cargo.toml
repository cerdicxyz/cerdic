[workspace]
# Standalone workspace root — see arkworks-prover/Cargo.toml for why.

[package]
name = "tiny-tee"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "tiny-tee"
path = "src/main.rs"

[dependencies]
arkworks-prover = { path = "../arkworks-prover" }
ark-bn254 = "0.5"
ark-ff = "0.5"

tokio = { version = "1", features = ["full"] }
axum = "0.7"
ethers = "2"

crypto_box = { version = "0.9", features = ["std"] }
chacha20poly1305 = "0.10"
rand = "0.8"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
base64 = "0.22"
dotenvy = "0.15"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"

[profile.release]
opt-level = 3
